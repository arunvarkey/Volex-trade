name: CI

# Quality gate for every push on every branch: static analysis + the full
# unit-test suite. The release APK build (build.yml) still runs only on the
# main branches; this one is the fast, always-on discipline check.

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Gate on ERRORS for now. flutter analyze (unlike dart analyze) treats
      # infos as fatal by default, and the codebase carries ~500 pre-existing
      # withOpacity deprecation infos scheduled for M0 cleanup (ROADMAP.md).
      # Tighten to --fatal-warnings, then --fatal-infos, as M0 lands.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
