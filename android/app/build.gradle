plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase's Google-Services + Crashlytics Gradle plugins hard-require a
// google-services.json. Apply them only when that file is present, so the app
// builds and runs Firebase-free (like the web preview) for developers who
// haven't configured a Firebase project.
def googleServicesFile = rootProject.file("app/google-services.json")
if (googleServicesFile.exists()) {
    apply plugin: "com.google.gms.google-services"
    apply plugin: "com.google.firebase.crashlytics"
} else {
    println("⚠️  google-services.json not found — Firebase Gradle plugins skipped (running Firebase-free).")
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.antigravity.volextrade"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            } else {
                // Fallback: sign release builds with the standard Android
                // debug keystore (auto-created in the user's home by any debug
                // run), so `flutter build apk --release` works with zero setup
                // for sideloading/testing. Provide android/key.properties with
                // a real upload key for a Play Store build.
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                storeFile file("${System.properties['user.home']}/.android/debug.keystore")
                storePassword 'android'
            }
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.antigravity.volextrade"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Code shrinking/obfuscation is disabled for now so release APKs
            // run reliably (ProGuard stripping Firebase/reflection classes is a
            // common launch-crash cause). Re-enable both — with verified
            // proguard-rules.pro — when preparing a Play Store build.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.8.0')

    // Add the dependencies for Firebase products you want to use
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Surgical resolution for duplicate class com.google.protobuf.DescriptorProtos
    // This allows protolite-well-known-types to provide LatLng while resolving
    // the conflict with newer protobuf-javalite versions found in Firebase BoM.
    configurations.all {
        resolutionStrategy {
            force 'com.google.protobuf:protobuf-javalite:3.25.1'
        }
    }
}
